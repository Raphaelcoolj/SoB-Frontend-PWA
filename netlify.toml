[build]
  command = "npm run build"
  publish = ".next"
  [build.environment]
    # The Sentry DSN is a public client identifier (not a credential), but the
    # SDK inlines its value into server/edge build output. Netlify's secrets
    # scanner (configured via env vars, not a TOML table) treats any value of an
    # env var it sees as a secret and fails the build. Exempt the DSN keys.
    SECRETS_SCAN_OMIT_KEYS = "SENTRY_DSN,NEXT_PUBLIC_SENTRY_DSN"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://res.cloudinary.com https://*.mux.com platform-data:; font-src 'self' data:; connect-src 'self' blob: https://api.spherebrilliq.online wss://api.spherebrilliq.online https://sob-backend-api.onrender.com wss://sob-backend-api.onrender.com https://res.cloudinary.com https://*.mux.com; media-src 'self' blob: https://*.mux.com https://res.cloudinary.com platform-data:; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), payment=(), usb=(), serial=(), magnetometer=(), gyroscope=(), accelerometer=(), ambient-light-sensor=(), idle-detection=(), screen-wake-lock=(), window-management=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/home"
  [headers.values]
    Cache-Control = "private, no-store"

