[build]
  command = "npm run build"
  publish = ".next"
  [build.environment]
    # The Sentry DSN is a public client identifier (not a credential), but the
    # SDK inlines its value into server/edge build output. Netlify's secrets
    # scanner (configured via env vars, not a TOML table) treats any value of an
    # env var it sees as a secret and fails the build. Exempt the DSN keys.
    SECRETS_SCAN_OMIT_KEYS = "SENTRY_DSN,NEXT_PUBLIC_SENTRY_DSN"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/serwist/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/javascript"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/javascript"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
