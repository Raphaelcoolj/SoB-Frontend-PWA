[build]
  command = "npm run build"
  publish = ".next"

# The Sentry DSN is a public client identifier (not a credential). The Sentry SDK
# inlines its value into server/edge build output, which trips Netlify's secrets
# scanner and fails every deploy. Exempt the DSN keys from scanning.
[secrets_scan]
  omit_keys = ["SENTRY_DSN", "NEXT_PUBLIC_SENTRY_DSN"]

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/serwist/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/javascript"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/javascript"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
